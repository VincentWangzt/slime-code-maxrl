[project]
name = "forecastbench-data"
version = "0.1.0"
description = "Filter, deduplicate, analyze, and split ForecastBench data"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<24",
    "rich>=13.9,<15",
    "transformers>=4.51,<5",
]

[project.scripts]
forecastbench-data = "forecastbench_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forecastbench_data"]

[tool.ruff]
line-length = 119
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

