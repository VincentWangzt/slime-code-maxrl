[project]
name = "fermi-data"
version = "0.1.0"
description = "Download, deduplicate, split, and analyze Fermi-problem datasets"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<24",
    "transformers>=4.51,<5",
]

[project.scripts]
fermi-data = "fermi_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fermi_data"]

[tool.ruff]
line-length = 119
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
